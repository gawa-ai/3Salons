# Shahina Ahmed Luxury Salon — Netlify configuration (separate site; does not touch SimplyBooked)
[build]
  base = "web"
  command = "npm install --no-audit --no-fund && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public values only. Never add a service-role / secret key here.
  SUPABASE_URL = "https://vqkrvbtndnnxpcemkuce.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable__0EaCw7l1NKRnmOXEKl2Gg_2_g0I1KD"
  SALON_SLUG = "shahina-ahmed"
  # Public half of the web-push key (safe in the browser). The private half is only an Edge Function secret.
  VAPID_PUBLIC_KEY = "BBOV4d9tJmk-RNq3XEHlGd-4m70cNYHJawCWqyoYiN_ZPREFW8Ja0Wb-s1cs-2gruld1fIoyp-4rJxak1v-A1Yw"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://vqkrvbtndnnxpcemkuce.supabase.co; media-src 'self' blob: https://vqkrvbtndnnxpcemkuce.supabase.co; font-src 'self'; connect-src 'self' https://vqkrvbtndnnxpcemkuce.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
