# Shahina Ahmed Luxury Salon — Netlify configuration (separate site; does not touch SimplyBooked)
[build]
  base = "web"
  command = "npm install --no-audit --no-fund && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public values only. Never add a service-role / secret key here.
  SUPABASE_URL = "https://vqkrvbtndnnxpcemkuce.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable__0EaCw7l1NKRnmOXEKl2Gg_2_g0I1KD"
  SALON_SLUG = "shahina-ahmed"

# ---- COMING SOON GATE (temporary) -------------------------------------------------
# While these rules are active, every URL shows /coming-soon.html and the booking site,
# Studio and logins cannot be reached. TO GO LIVE: delete this whole block (down to the
# "END COMING SOON" line) and redeploy. The real site below is untouched.
[[redirects]]
  from = "/coming-soon.css"
  to = "/coming-soon.css"
  status = 200
  force = true
[[redirects]]
  from = "/fonts/*"
  to = "/fonts/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/brand/*"
  to = "/brand/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200
  force = true
[[redirects]]
  from = "/favicon-32.png"
  to = "/favicon-32.png"
  status = 200
  force = true
[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/apple-touch-icon.png"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/coming-soon.html"
  status = 200
  force = true
# ---- END COMING SOON ---------------------------------------------------------------

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://vqkrvbtndnnxpcemkuce.supabase.co; media-src 'self' blob: https://vqkrvbtndnnxpcemkuce.supabase.co; font-src 'self'; connect-src 'self' https://vqkrvbtndnnxpcemkuce.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
