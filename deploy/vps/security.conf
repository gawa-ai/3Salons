# Same security headers as netlify.toml ("/*"). Included in every location (nginx add_header is not inherited).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://vqkrvbtndnnxpcemkuce.supabase.co; media-src 'self' blob: https://vqkrvbtndnnxpcemkuce.supabase.co; font-src 'self'; connect-src 'self' https://vqkrvbtndnnxpcemkuce.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
