# Mirrors netlify.toml: SPA fallback, cache rules, service worker + manifest headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /assets/ {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /fonts/ {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
  location = /sw.js {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    types { text/javascript js; }
    default_type text/javascript;
    charset utf-8;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
