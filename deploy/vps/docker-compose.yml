# Shahina Ahmed site on the VPS: static nginx behind the existing Traefik (host network, Let's Encrypt).
# Same pattern as /docker/sellintel. Own project, own network; touches nothing else.
services:
  web:
    image: nginx:1.27-alpine
    container_name: shahina-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security.conf:/etc/nginx/snippets/security.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.shahina.rule=Host(`shahina.srv1991689.hstgr.cloud`)
      - traefik.http.routers.shahina.entrypoints=websecure
      - traefik.http.routers.shahina.tls.certresolver=letsencrypt
      - traefik.http.services.shahina.loadbalancer.server.port=8080
